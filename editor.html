e-state.alert{border-color:#a66c28;background:#2a2012;color:#ffd27f}\n\n/* v00182 — modo prático: ferramentas técnicas recolhidas + ajuda contextual */\n.advanced-tools{position:absolute;right:10px;top:52px;z-index:15;display:flex;gap:5px;padding:8px;background:#101720;border:1px solid var(--line2);box-shadow:0 8px 24px #0008;flex-wrap:wrap;max-width:520px}\n.advanced-library-tab{display:none}.advanced-mode .advanced-library-tab{display:inline-block}\n.field-help{display:block;margin:-1px 0 5px;color:var(--muted);font-size:8px;line-height:1.35;font-weight:400}.field-help b{color:#b9c8d4;font-weight:600}\n.field label{margin-bottom:2px}.simple-tip{color:var(--muted);font-size:8px}.toolbar{position:relative}\n@media(max-width:1380px){#advancedBtn{padding:6px 7px}.advanced-tools{right:0;top:46px}}\n\n.mode-switch{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text,#eef);border:1px solid var(--line,#334);background:var(--panel,#182431);border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px}\n\n</style>\n</head>\n<body>\n<header>\n  <div><h1>🗺️ TERRÓPIA · EDITOR DE MUNDO</h1><div class=\"sub\">Edite o mundo de forma visual. O editor cuida da parte técnica.</div></div>\n  <div class=\"toolbar\">\n    <a href=\"editor.html?mode=mobile\" target=\"_top\" class=\"mode-switch\" title=\"Abrir interface compacta\">📱 Mobile</a>\n    <span id=\"saveState\" class=\"save-state\">Sem alterações</span>\n    <button id=\"undoBtn\" title=\"Desfazer (Ctrl+Z)\">↶</button><button id=\"redoBtn\" title=\"Refazer (Ctrl+Shift+Z)\">↷</button>\n    <button id=\"diffBtn\">Ver alterações</button>\n    <button id=\"importBtn\">Importar</button><input id=\"importFile\" class=\"hidden\" type=\"file\" accept=\"application/json,.json\">\n    <button id=\"exportPrompt\" class=\"primary\">Exportar para ChatGPT</button>\n    <button id=\"advancedBtn\" title=\"Mostra ferramentas técnicas que normalmente não são necessárias\">Mais ▾</button>\n    <button id=\"helpBtn\" title=\"Ajuda\">?</button>\n    <div id=\"advancedTools\" class=\"advanced-tools hidden\">\n      <button id=\"validateBtn\">Validar</button><button id=\"exportSnapshot\">Snapshot</button><button id=\"exportChanges\">Changes</button><button id=\"rpgBtn\">RPG avançado</button><button id=\"divergenceState\" class=\"runtime-state\" title=\"Auditoria automática Editor ↔ runtime\">Runtime ✓</button>\n    </div>\n  </div>\n</header>\n<div class=\"app\">\n  <section class=\"pane map-pane\">\n    <div class=\"pane-head map-controls\"><strong>MAPA DO MUNDO</strong><span class=\"map-help\">Clique · Shift/Ctrl multisseleciona · arraste telas</span><span class=\"spacer\"></span><label class=\"inline-control\">Overlay <select id=\"overlaySelect\"><option value=\"none\">Nenhum</option><option value=\"content\">Conteúdo</option><option value=\"npcs\">NPCs</option><option value=\"resources\">Recursos</option><option value=\"enemies\">Inimigos</option><option value=\"buildings\">Construções</option><option value=\"quests\">Quests</option><option value=\"interiors\">Interiores</option><option value=\"events\">Eventos</option><option value=\"layers\">Camadas</option><option value=\"progression\">Progressão</option><option value=\"changes\">Alterações</option></select></label><span id=\"multiScreenState\" class=\"selection-state\">0 selecionadas</span><button id=\"clearScreenSelection\" class=\"mini\">Limpar</button><button id=\"templateBtn\" class=\"mini primary\">Templates</button><button id=\"resetProject\" class=\"danger mini\">Reset</button></div>\n    <div class=\"map-scroll\"><div id=\"worldGrid\" class=\"world-grid\"></div></div>\n    <div class=\"legend\">\n      <span style=\"--c:var(--A)\">Atenaria</span><span style=\"--c:var(--L)\">Altaria</span><span style=\"--c:var(--M)\">Mornaqua</span><span style=\"--c:var(--I)\">Invérnia</span><span style=\"--c:var(--C)\">Calindra</span><span style=\"--c:var(--S)\">Solácia</span><span style=\"--c:var(--B)\">Blazíria</span><span style=\"--c:var(--N)\">Necrovícia</span>\n      <span class=\"spacer\"></span>■ amarelo = alterada · ■ verde = nova\n    </div>\n  </section>\n  <section class=\"pane inspector\">\n    <div class=\"pane-head\"><strong>TELA SELECIONADA</strong><span class=\"spacer\"></span><span class=\"tiny\">conteúdo estruturado + texto livre</span></div>\n    <div id=\"inspectorEmpty\" class=\"empty-state\">Selecione uma tela no mapa.<br><br>Escolha uma tela para editar. Os campos mostram instruções e exemplos logo abaixo do título.</div>\n    <div id=\"inspectorBody\" class=\"inspector-body hidden\">\n      <div class=\"screen-title\"><div><div id=\"screenCode\" class=\"code\"></div><div id=\"screenMeta\" class=\"meta\"></div></div><span id=\"changedBadge\" class=\"badge changed hidden\">ALTERADA</span></div>\n\n      <section class=\"editor-section blueprint-section\"><div class=\"section-title\"><strong>🧭 BLUEPRINT 16:9</strong><span>arraste conteúdo · Shift/Ctrl = multi-seleção</span><span class=\"spacer\"></span><span id=\"blueprintSelectionState\" class=\"selection-state\">0 itens</span></div><div id=\"blueprintSurface\" class=\"blueprint-surface\" tabindex=\"0\"></div><div class=\"blueprint-foot\"><span>As posições são percentuais e entram no Change Set.</span><span>Arraste itens da biblioteca diretamente para a tela.</span></div></section>\n\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>⚡ EVENTOS / ESTADOS</strong><span>Quando → Se → Então</span><span class=\"spacer\"></span><button class=\"mini primary\" id=\"addEvent\">+ Evento</button></div><div id=\"eventCards\" class=\"card-list\"></div></section>\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>🧩 RPG DA TELA</strong><span>quests + camadas de mundo</span></div><div id=\"screenQuestRefs\" class=\"rpg-ref-list\"></div><div id=\"screenLayerRefs\" class=\"rpg-ref-list\"></div></section>\n\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>CONEXÕES</strong><span>adjacência automática + metadata editável</span></div><div id=\"connections\" class=\"connection-list\"></div></section>\n\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>IDENTIDADE</strong></div>\n        <div class=\"field\"><label>Nome da tela</label><input data-field=\"name\"></div>\n        <div class=\"row2\"><div class=\"field\"><label>Área/ID runtime</label><input data-field=\"area\"></div><div class=\"field\"><label>Tipo</label><select data-field=\"type\"><option>overworld</option><option>town</option><option>dungeon</option><option>interior</option></select></div></div>\n        <div class=\"field\"><label>Região</label><select data-field=\"region\"><option>Atenaria</option><option>Altaria</option><option>Mornaqua</option><option>Invérnia</option><option>Calindra</option><option>Solácia</option><option>Blazíria</option><option>Necrovícia</option></select></div>\n      </section>\n\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>CONTROLE DE DESIGN</strong><span>define onde o ChatGPT pode decidir</span></div>\n        <div class=\"field\"><label>Grau de liberdade</label><select id=\"freedomSelect\"><option value=\"exact\">🔒 Exato — implementar como especificado</option><option value=\"structured\">◐ Estruturado — conteúdo exato, composição ajustável</option><option value=\"creative\">✨ Direção criativa — completar com coerência</option></select></div>\n        <div class=\"restriction-grid\" id=\"restrictionGrid\">\n          <label><input type=\"checkbox\" data-restriction=\"camera\"> Não alterar câmera</label><label><input type=\"checkbox\" data-restriction=\"connections\"> Não alterar conexões</label>\n          <label><input type=\"checkbox\" data-restriction=\"npcs\"> Não alterar NPCs existentes</label><label><input type=\"checkbox\" data-restriction=\"quests\"> Não alterar quests</label>\n          <label><input type=\"checkbox\" data-restriction=\"difficulty\"> Não alterar dificuldade</label><label><input type=\"checkbox\" data-restriction=\"layout\"> Não alterar layout existente</label>\n        </div>\n        <div class=\"field\"><label>Outras restrições</label><textarea id=\"restrictionNotes\" class=\"short\"></textarea></div>\n      </section>\n\n      <div id=\"entitySections\"></div>\n\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>INTERIORES / SUBÁREAS</strong><span class=\"spacer\"></span><button class=\"mini\" id=\"addInterior\">+ Interior</button></div><div id=\"interiorCards\" class=\"card-list\"></div></section>\n\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>MECÂNICAS / FUNÇÕES</strong><span>uma por linha · use apenas quando precisar</span></div><div class=\"field\"><textarea class=\"short\" data-field=\"mechanics\"></textarea></div></section>\n      <section class=\"editor-section\"><div class=\"section-title\"><strong>OBSERVAÇÕES / DIREÇÃO</strong></div><div class=\"field\"><textarea data-field=\"notes\"></textarea></div></section>\n      <div class=\"inspector-actions\"><button id=\"resetScreen\">Restaurar tela</button><button id=\"deleteScreen\" class=\"danger\">Remover tela</button><button id=\"exportScreenPrompt\" class=\"primary\">Exportar esta tela</button></div>\n    </div>\n  </section>\n  <aside class=\"pane library\">\n    <div class=\"pane-head\"><strong>BIBLIOTECA DE CONTEÚDO</strong><span class=\"spacer\"></span><span id=\"runtimeStatus\" class=\"tiny\">carregando…</span></div>\n    <div class=\"library-search\"><input id=\"librarySearch\" placeholder=\"Buscar recurso, NPC, mecânica...\"></div>\n    <div class=\"tabs\"><button class=\"active\" data-tab=\"npcs\">NPCs</button><button data-tab=\"resources\">Recursos</button><button data-tab=\"enemies\">Inimigos</button><button data-tab=\"buildings\">Construções</button><button data-tab=\"mechanics\">Mecânicas</button><button data-tab=\"runtime\" class=\"advanced-library-tab\">Técnico</button></div>\n    <div id=\"libraryList\" class=\"library-list\"></div>\n    <div class=\"library-footer\">Arraste NPCs, recursos, inimigos e construções para a tela. Clique em um item para editar seus detalhes.</div>\n  </aside>\n</div>\n\n<div id=\"createModal\" class=\"modal hidden\"><div class=\"modal-card\"><h2>Criar nova tela</h2><p>O código é permanente. A posição cria a intenção de conexões ortogonais.</p><div class=\"row2\"><div class=\"field\"><label>Código</label><input id=\"newCode\"></div><div class=\"field\"><label>Nome</label><input id=\"newName\"></div></div><div class=\"field\"><label>Região</label><select id=\"newRegion\"><option>Atenaria</option><option>Altaria</option><option>Mornaqua</option><option>Invérnia</option><option>Calindra</option><option>Solácia</option><option>Blazíria</option><option>Necrovícia</option></select></div><div class=\"modal-actions\"><button data-close=\"createModal\">Cancelar</button><button id=\"confirmCreate\" class=\"primary\">Criar tela</button></div></div></div>\n\n<div id=\"entityModal\" class=\"modal hidden\"><div class=\"modal-card wide\"><h2 id=\"entityModalTitle\">Conteúdo</h2><div class=\"row2\"><div class=\"field\"><label>Origem</label><select id=\"entityStatus\"><option value=\"existing\">Existente no jogo</option><option value=\"new\">Novo — precisa ser criado</option></select></div><div class=\"field\"><label>ID / definição</label><input id=\"entityDefinitionId\" placeholder=\"ex.: npc_elis\"></div></div><div class=\"row2\"><div class=\"field\"><label>Nome</label><input id=\"entityName\"></div><div class=\"field\"><label>Quantidade</label><input id=\"entityQuantity\" type=\"number\" min=\"1\" value=\"1\"></div></div><div class=\"field\"><label>Camada de mundo desta instância</label><select id=\"entityLayer\"></select></div><div id=\"entitySpecific\"></div><div class=\"field\"><label>Observações deste item</label><textarea id=\"entityNotes\" class=\"short\"></textarea></div><div class=\"modal-actions\"><button id=\"deleteEntity\" class=\"danger\">Remover</button><span class=\"spacer\"></span><button data-close=\"entityModal\">Cancelar</button><button id=\"saveEntity\" class=\"primary\">Salvar</button></div></div></div>\n\n<div id=\"connectionModal\" class=\"modal hidden\"><div class=\"modal-card\"><h2 id=\"connectionTitle\">Conexão</h2><div class=\"row2\"><div class=\"field\"><label>Estado</label><select id=\"connEnabled\"><option value=\"true\">Ativa</option><option value=\"false\">Desativada</option></select></div><div class=\"field\"><label>Direção</label><input id=\"connDirection\" disabled></div></div><div class=\"restriction-grid\"><label><input id=\"connOneWay\" type=\"checkbox\"> Mão única</label><label><input id=\"connBlocked\" type=\"checkbox\"> Bloqueada inicialmente</label></div><div class=\"field\"><label>Requisito legível</label><input id=\"connRequirement\" placeholder=\"gerado automaticamente ou observação livre\"></div>\n<div class=\"lock-builder\"><div class=\"field\"><label>Progression Lock</label><select id=\"connLockType\"><option value=\"none\">Nenhum</option><option value=\"quest\">Quest</option><option value=\"skill\">Skill</option><option value=\"flag\">Flag</option><option value=\"item\">Item</option><option value=\"custom\">Custom</option></select></div><div class=\"field\"><label>Chave/ID</label><input id=\"connLockKey\" placeholder=\"quest_id / alchemy / bridge_fixed\"></div><div class=\"field\"><label>Operador</label><select id=\"connLockOperator\"><option value=\"\">automático</option><option value=\"completed\">completed</option><option value=\"truthy\">truthy</option><option value=\"equals\">equals</option><option value=\"gte\">&gt;=</option></select></div><div class=\"field\"><label>Valor</label><input id=\"connLockValue\" placeholder=\"10 / true / item qty\"></div></div><div class=\"row2\"><div class=\"field\"><label>Transição</label><input id=\"connTransition\" placeholder=\"padrão\"></div><div class=\"field\"><label>Spawn no destino</label><input id=\"connSpawn\" placeholder=\"automático\"></div></div><div class=\"field\"><label>Observações</label><textarea id=\"connNotes\" class=\"short\"></textarea></div><div class=\"modal-actions\"><button id=\"resetConnection\">Restaurar padrão</button><span class=\"spacer\"></span><button data-close=\"connectionModal\">Cancelar</button><button id=\"saveConnection\" class=\"primary\">Salvar</button></div></div></div>\n\n<div id=\"interiorModal\" class=\"modal hidden\"><div class=\"modal-card\"><h2>Interior / Subárea</h2><div class=\"row2\"><div class=\"field\"><label>ID permanente</label><input id=\"interiorId\" placeholder=\"interior_alchemist_hut\"></div><div class=\"field\"><label>Nome</label><input id=\"interiorName\"></div></div><div class=\"field\"><label>Vincular à construção</label><select id=\"interiorBuilding\"></select></div><div class=\"restriction-grid\"><label><input id=\"interiorReturn\" type=\"checkbox\" checked> Possui retorno para a tela</label><label><input id=\"interiorImplemented\" type=\"checkbox\"> Já existe no runtime</label></div><div class=\"field\"><label>Conteúdo / direção do interior</label><textarea id=\"interiorNotes\"></textarea></div><div class=\"modal-actions\"><button id=\"deleteInterior\" class=\"danger\">Remover</button><span class=\"spacer\"></span><button data-close=\"interiorModal\">Cancelar</button><button id=\"saveInterior\" class=\"primary\">Salvar</button></div></div></div>\n\n<div id=\"diffModal\" class=\"modal hidden\"><div class=\"modal-card xwide\"><h2>Alterações desde a base implementada</h2><div id=\"diffSummary\" class=\"diff-summary\"></div><div id=\"diffContent\" class=\"diff-content\"></div><div class=\"modal-actions\"><button data-close=\"diffModal\" class=\"primary\">Fechar</button></div></div></div>\n<div id=\"validationModal\" class=\"modal hidden\"><div class=\"modal-card xwide\"><h2>Validação do Mundo</h2><div id=\"validationSummary\" class=\"diff-summary\"></div><div id=\"validationContent\" class=\"validation-list\"></div><div class=\"modal-actions\"><button data-close=\"validationModal\" class=\"primary\">Fechar</button></div></div></div>\n\n<div id=\"templateModal\" class=\"modal hidden\"><div class=\"modal-card xwide\"><h2>Templates visuais</h2><p>Aplicar não sobrescreve conteúdo existente. Se houver múltiplas telas selecionadas no mapa, o template é aplicado a todas.</p><div id=\"templateList\" class=\"template-grid\"></div><div class=\"modal-actions\"><button id=\"saveTemplate\" title=\"Salva conteúdo/layout da tela atual como template reutilizável\">Salvar tela atual como template</button><span class=\"spacer\"></span><button data-close=\"templateModal\" class=\"primary\">Fechar</button></div></div></div>\n\n<div id=\"usageModal\" class=\"modal hidden\"><div class=\"modal-card xwide\"><h2 id=\"usageTitle\">Onde isto é usado?</h2><div id=\"usageSummary\" class=\"diff-summary\"></div><div id=\"usageContent\" class=\"usage-list\"></div><div class=\"modal-actions\"><button data-close=\"usageModal\" class=\"primary\">Fechar</button></div></div></div>\n\n\n<div id=\"eventModal\" class=\"modal hidden\"><div class=\"modal-card xwide\"><h2 id=\"eventModalTitle\">Event Builder</h2>\n  <div class=\"row2\"><div class=\"field\"><label>ID permanente</label><input id=\"eventId\"></div><div class=\"field\"><label>Nome</label><input id=\"eventName\"></div></div>\n  <div class=\"row2\"><div class=\"field\"><label>Trigger</label><select id=\"eventTrigger\"><option value=\"screenEnter\">Jogador entra na tela</option><option value=\"interact\">Interação</option><option value=\"proximity\">Proximidade</option><option value=\"questUpdate\">Quest atualizada</option><option value=\"combatEnd\">Fim de combate</option><option value=\"timer\">Timer</option><option value=\"custom\">Custom</option></select></div><div class=\"field\"><label>Alvo / IID opcional</label><input id=\"eventTarget\" placeholder=\"NPC, construção ou recurso\"></div></div>\n  <div class=\"restriction-grid\"><label><input id=\"eventEnabled\" type=\"checkbox\" checked> Evento ativo</label></div>\n  <div class=\"event-builder-grid\"><aside><div class=\"section-title\"><strong>PÁGINAS / ESTADOS</strong><span class=\"spacer\"></span><button id=\"addEventPage\" class=\"mini\">+ Estado</button></div><div id=\"eventPageList\" class=\"event-page-list\"></div></aside>\n  <main><div class=\"row2\"><div class=\"field\"><label>Nome do estado</label><input id=\"eventPageName\"></div><div class=\"field\"><label>Prioridade</label><input id=\"eventPagePriority\" type=\"number\" min=\"1\"></div></div><div class=\"field\"><label>Camada ativa neste estado</label><select id=\"eventPageLayer\"></select></div>\n  <div class=\"builder-block\"><div class=\"section-title\"><strong>SE — Condições</strong><span class=\"spacer\"></span><button id=\"addEventCondition\" class=\"mini\">+ Condição</button></div><div id=\"eventConditionRows\"></div></div>\n  <div class=\"builder-block\"><div class=\"section-title\"><strong>ENTÃO — Ações</strong><span class=\"spacer\"></span><button id=\"addEventAction\" class=\"mini\">+ Ação</button></div><div id=\"eventActionRows\"></div></div></main></div>\n  <div class=\"field\"><label>Notas do evento</label><textarea id=\"eventNotes\" class=\"short\"></textarea></div>\n  <div class=\"modal-actions\"><button id=\"deleteEvent\" class=\"danger\">Remover evento</button><span class=\"spacer\"></span><button data-close=\"eventModal\">Cancelar</button><button id=\"saveEvent\" class=\"primary\">Salvar evento</button></div>\n</div></div>\n\n<div id=\"questModal\" class=\"modal hidden\"><div class=\"modal-card wide\"><h2>Quest</h2>\n<div class=\"row2\"><div class=\"field\"><label>Origem</label><select id=\"questStatus\"><option value=\"existing\">Existente no runtime</option><option value=\"new\">Nova</option></select></div><div class=\"field\"><label>ID</label><input id=\"questId\"></div></div>\n<div class=\"row2\"><div class=\"field\"><label>Nome</label><inp
